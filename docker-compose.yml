name: peach

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peach}
      POSTGRES_DB: ${POSTGRES_DB:-peach}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peach} -d ${POSTGRES_DB:-peach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [peach]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://peach:peach@db:5432/peach}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # From make auth-deploy. Unset, every /api/v1 route answers 503.
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [peach]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_COGNITO_AUTHORITY: ${COGNITO_AUTHORITY:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${COGNITO_LOCAL_REDIRECT_URI:-http://localhost:3000/auth/callback}
        NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${COGNITO_LOCAL_LOGOUT_URI:-http://localhost:3000/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_COGNITO_AUTHORITY: ${COGNITO_AUTHORITY:-}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${COGNITO_LOCAL_REDIRECT_URI:-http://localhost:3000/auth/callback}
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${COGNITO_LOCAL_LOGOUT_URI:-http://localhost:3000/}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [peach]

volumes:
  pgdata:

networks:
  peach:
    driver: bridge
