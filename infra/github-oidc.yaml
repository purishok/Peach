AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  A role GitHub Actions assumes through OIDC to publish backend images and roll
  the ECS service, limited to the configured repository and branch without
  storing long-lived AWS credentials in GitHub.

  Created by scripts/github-role.sh (make github-role).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Scopes what the role is allowed to touch.

  GitHubRepo:
    Type: String
    Description: owner/repo, e.g. dobosevych/Peach
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

  GitHubSubject:
    Type: String
    Description: >-
      Exact GitHub OIDC subject allowed to assume the role. This supports both
      legacy repo:owner/name subjects and immutable owner/repository ID subjects.
    AllowedPattern: "^repo:[A-Za-z0-9_.@/-]+:ref:refs/heads/[A-Za-z0-9._/-]+$"

  TaskExecutionRoleArn:
    Type: String
    Description: Exact execution role used by the ECS task definition being deployed.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"

  ExistingProviderArn:
    Type: String
    Default: ""
    Description: >-
      An account may hold only one GitHub OIDC provider. The script passes the
      existing one here if there is one, and this stack creates it otherwise.

Conditions:
  CreateProvider: !Equals [!Ref ExistingProviderArn, ""]

Resources:
  # Thumbprints are no longer what AWS checks for this issuer - it validates
  # against its own trust store - but the property is kept for older behaviour.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DeployRole:
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          GitHub Actions assumes this role to publish commit-tagged backend images
          and update the project's ECS service, with permissions limited to that path.
        must:
          - Trust only the configured GitHub repository and branch subject.
          - Keep ECR access scoped to this project's backend repository.
          - Pass only the active task execution role or project-prefixed task roles to ECS.
        mutable: change-with-constraints
        trust: GitHub OIDC, restricted by repository and branch subject.
        deps:
          - GitHub OIDC provider
          - Project ECR repository and ECS cluster, task definition, and service
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      Description: !Sub "Deploys ${ProjectName} from ${GitHubRepo}"
      MaxSessionDuration: 3600
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref OidcProvider
                - !Ref ExistingProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without the audience check any OIDC token would do.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exact match: no other repository or branch may deploy.
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: deploy-backend-ecs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"

              - Sid: PushProjectBackendImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/${ProjectName}-backend"

              - Sid: RegisterTaskDefinition
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: "*"

              - Sid: DescribeProjectCluster
                Effect: Allow
                Action: ecs:DescribeClusters
                Resource: !Sub "arn:aws:ecs:*:${AWS::AccountId}:cluster/${ProjectName}-*"

              - Sid: DeployProjectService
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:aws:ecs:*:${AWS::AccountId}:service/${ProjectName}-*/*"

              - Sid: ReadProjectTaskDefinitions
                Effect: Allow
                Action: ecs:DescribeTaskDefinition
                # ECS authorizes this read action against Resource "*".
                Resource: "*"

              - Sid: PassProjectTaskRolesToEcs
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  RoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt DeployRole.Arn

  Subject:
    Description: The only OIDC subject allowed to assume the role.
    Value: !Ref GitHubSubject

  ProviderArn:
    Value: !If
      - CreateProvider
      - !Ref OidcProvider
      - !Ref ExistingProviderArn
