AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Peach weekly meetings reports: EventBridge Scheduler sends commands through
  SQS to a VPC Lambda that reads PostgreSQL and writes deterministic CSV files;
  S3 ObjectCreated events invoke an out-of-VPC mailer that sends through SES.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Scheduler -> SQS -> builder Lambda -> PostgreSQL -> S3 -> mailer Lambda -> SES
    must:
      - Builder stays in DB VPC; mailer stays outside VPC
      - SQS visibility >= 6x builder timeout
      - S3 notifications only match reports/*.csv

Parameters:
  ProjectName:
    Type: String
    Default: peach
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RouteTableIds:
    Type: CommaDelimitedList
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecretArn:
    Type: String
    Description: Secret containing the SQLAlchemy database URL in database_url.
  ImageUri:
    Type: String
    Description: Lambda-compatible backend container image URI.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  ReportSenderEmail:
    Type: String
    Description: Existing verified SES sender, normally reports@verified-domain.
  ReportRecipientEmails:
    Type: String
    Description: Comma-separated recipients; sandbox recipients must be verified.
  SesIdentityName:
    Type: String
    Description: Verified SES email address or domain used to scope send permissions.
  CreateSesEmailIdentity:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create an SES domain identity for SesIdentityName when one is not already managed.
  LogRetentionDays:
    Type: Number
    Default: 14
  BuilderMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
  FailureTestWeek:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-W[0-9]{2}$"
    Description: Test-only poison week; keep empty during normal operation.

Conditions:
  ShouldCreateSesIdentity: !Equals [!Ref CreateSesEmailIdentity, "true"]

Resources:
  ReportsBucket:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    Metadata:
      com.aws.cloudformation.Context:
        why: private result store and event bridge between builder and mailer; same week overwrites same key
        must:
          - block all public access and enforce TLS
          - expire current and noncurrent report data after 90 days
          - notify mailer only for reports/*.csv
        mutable: change-with-constraints
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportsBucketPolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: reject plaintext transport for report data
        must: [keep aws:SecureTransport deny]
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ReportsBucket.Arn
              - !Sub "${ReportsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  S3GatewayEndpoint:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::VPCEndpoint
    Metadata:
      com.aws.cloudformation.Context:
        why: lets VPC builder upload to S3 without NAT or hourly interface-endpoint cost
        must: [attach every route table used by builder subnets]
        mutable: change-with-constraints
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: retains poison report commands after 3 receives for inspection and redrive
        must: [encrypt at rest, retain longer than source queue]
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: durable command buffer between weekly/manual producers and builder worker
        must:
          - maxReceiveCount = 3
          - VisibilityTimeout >= 6x builder timeout
        mutable: change-with-constraints
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: enforce encrypted transport for source queue and DLQ
        must: [keep aws:SecureTransport deny]
    Properties:
      Queues: [!Ref ReportRequestsQueue, !Ref ReportRequestsDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransportRequests
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ReportRequestsQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportDlq
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt ReportRequestsDlq.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ReportBuilderSecurityGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: isolates builder ENIs; DB ingress names this SG instead of a CIDR
        must: [no ingress rules]
    Properties:
      GroupDescription: !Sub "${ProjectName} weekly report builder"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-report-builder"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseIngressFromReportBuilder:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      com.aws.cloudformation.Context:
        why: builder needs PostgreSQL access to the existing private database
        must: [source only ReportBuilderSecurityGroup, TCP 5432 only]
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      Description: Peach weekly report builder
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ReportBuilderSecurityGroup

  ReportBuilderLogGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: builder execution identity scoped to logs, VPC ENIs, source queue, and report writes
        must: [no read access to unrelated S3 prefixes]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReportBuilderRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ReportBuilderLogGroup.Arn}:*"
              - Sid: VpcNetworking
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Sid: ConsumeQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
              - Sid: WriteReports
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ReportsBucket.Arn}/reports/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    DependsOn: DatabaseIngressFromReportBuilder
    Metadata:
      com.aws.cloudformation.Context:
        why: on-demand SQS worker reads private PostgreSQL and writes one deterministic S3 key per ISO week
        must:
          - VPC attached for DB access
          - object key is reports/YYYY-Www.csv
          - exceptions propagate for SQS retry and DLQ
        mutable: change-with-constraints
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Build Peach weekly meeting CSV reports
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [app.reports.lambda_handler.handler]
      Architectures: [!Ref Architecture]
      MemorySize: !Ref BuilderMemorySize
      Timeout: 60
      Role: !GetAtt ReportBuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref ReportBuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref ReportBuilderSecurityGroup]
      Environment:
        Variables:
          APP_ENV: production
          DB_POOLING: "false"
          DATABASE_URL: !Sub "{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:database_url}}"
          REPORTS_BUCKET: !Ref ReportsBucket
          REPORT_FAILURE_TEST_WEEK: !Ref FailureTestWeek
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportQueueEventSource:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Metadata:
      com.aws.cloudformation.Context:
        why: native SQS polling gives retries and DLQ behavior without an always-on worker
        must: [BatchSize = 1]
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref ReportBuilderFunction

  SchedulerRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: weekly schedule may send exactly one command to the report queue
        must: [SendMessage scoped to ReportRequestsQueue]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: SendWeeklyReportCommand
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklyReportSchedule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Scheduler::Schedule
    Metadata:
      com.aws.cloudformation.Context:
        why: timezone-aware weekly producer follows Kyiv daylight-saving changes
        must:
          - cron is Monday 07:00 Europe/Kyiv
          - target SQS rather than Lambda
    Properties:
      Name: !Sub "${ProjectName}-weekly-reports"
      Description: Every Monday at 07:00 Europe/Kyiv
      State: ENABLED
      ScheduleExpression: cron(0 7 ? * MON *)
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source":"schedule","week":null}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

  SesEmailIdentity:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SES::EmailIdentity
    Condition: ShouldCreateSesIdentity
    Metadata:
      com.aws.cloudformation.Context:
        why: optional email identity verification when sender is not managed elsewhere
        must: [verification status must be confirmed before claiming delivery]
    Properties:
      EmailIdentity: !Ref SesIdentityName
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerLogGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: mailer execution identity can read report objects and send only from configured SES identity
        must: [no S3 PutObject permission]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReportMailerRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ReportMailerLogGroup.Arn}:*"
              - Sid: ReadReports
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Sid: SendReportEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityName}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: out-of-VPC subscriber downloads new CSV files and sends MIME attachments through SES
        must:
          - no VpcConfig; SES reachable without NAT
          - never write to reports/ prefix
          - duplicate S3 notifications may send duplicate email
        mutable: change-with-constraints
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Email Peach weekly meeting CSV reports
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [app.reports.mailer.handler]
      Architectures: [!Ref Architecture]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ReportMailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref ReportMailerLogGroup
      Environment:
        Variables:
          REPORT_SENDER: !Ref ReportSenderEmail
          REPORT_RECIPIENTS: !Ref ReportRecipientEmails
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerInvokePermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Metadata:
      com.aws.cloudformation.Context:
        why: only this account's deterministic reports bucket may invoke mailer
        must: [keep SourceArn and SourceAccount restrictions]
    Properties:
      FunctionName: !Ref ReportMailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}"

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
  ReportRequestsQueueArn:
    Value: !GetAtt ReportRequestsQueue.Arn
  ReportRequestsDlqUrl:
    Value: !Ref ReportRequestsDlq
  ReportBuilderFunctionName:
    Value: !Ref ReportBuilderFunction
  ReportMailerFunctionName:
    Value: !Ref ReportMailerFunction
  WeeklyScheduleName:
    Value: !Ref WeeklyReportSchedule
  BuilderLogGroupName:
    Value: !Ref ReportBuilderLogGroup
  MailerLogGroupName:
    Value: !Ref ReportMailerLogGroup
  SesDkimName1:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenName1
  SesDkimValue1:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenValue1
  SesDkimName2:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenName2
  SesDkimValue2:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenValue2
  SesDkimName3:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenName3
  SesDkimValue3:
    Condition: ShouldCreateSesIdentity
    Value: !GetAtt SesEmailIdentity.DkimDNSTokenValue3
