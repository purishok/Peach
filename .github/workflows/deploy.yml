name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peach
          POSTGRES_PASSWORD: peach
          POSTGRES_DB: peach
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U peach -d peach"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://peach:peach@localhost:5432/peach
      APP_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'peach-backend' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          allowed-account-ids: "505464394565"

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "505464394565"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push commit-tagged image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register task definition and roll ECS service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for name in ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION ECS_CONTAINER_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository variable: $name" >&2
              exit 1
            fi
          done

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > /tmp/task-definition.json

          jq --arg name "$ECS_CONTAINER_NAME" \
             --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            'if any(.containerDefinitions[]; .name == $name)
             then .containerDefinitions |= map(if .name == $name then .image = $image else . end)
             else error("container name not found in task definition") end
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            /tmp/task-definition.json > /tmp/task-definition-updated.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-definition-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$task_definition_arn" >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
