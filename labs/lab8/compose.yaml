name: peach-lab8
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:9644:9644"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
  console:
    image: docker.redpanda.com/redpandadata/console:v3.3.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports: ["127.0.0.1:${LAB8_CONSOLE_PORT:-8088}:8080"]
    depends_on:
      redpanda:
        condition: service_healthy
volumes:
  redpanda:
